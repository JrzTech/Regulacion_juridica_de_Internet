const S=[
{t:"Internet en México y su repercusión en el derecho",sh:"Internet en México",
ana:"Internet es como una carretera nacional: cada vez circulan más vehículos, así que hacen falta reglamento de tránsito, autoridades y reglas para todos. El derecho es ese reglamento.",
tabs:[["Datos",`<div class="stats"><div class="stat"><b>86.1%</b><small>usuarios de Internet en 2025 (57.4% en 2015)</small></div><div class="stat"><b>78.3%</b><small>de las familias con acceso</small></div><div class="stat"><b>97.3%</b><small>navega desde su celular</small></div></div><p>Aún hay brecha: uso del 88.9% en zonas urbanas y 75.2% en rurales. <small>(INEGI, ENDUTIH 2025)</small></p>`],
["Marco legal",`<h4>Constitución</h4><p><b>Art. 6.º:</b> derecho a acceder a las tecnologías de la información y a la banda ancha (reforma de 2013). <b>Art. 7.º:</b> libertad de difundir ideas por cualquier medio.</p><h4>Reforma de 2025</h4><p>La nueva Ley en Materia de Telecomunicaciones y Radiodifusión (DOF 16/07/2025) sustituyó a la de 2014. El IFT desapareció y sus funciones pasaron a la Agencia de Transformación Digital y Telecomunicaciones y a la Comisión Reguladora de Telecomunicaciones.</p>`],
["Ramas del derecho",`<p>Toca cada tarjeta:</p><div class="flip" data-flip='[["Constitucional","Acceso a Internet como derecho humano. Arts. 6 y 7."],["Administrativo","Regulación del sector telecom. Ley de Telecomunicaciones (2025)."],["Civil y mercantil","Contratos y firma electrónica. Código Civil Federal y Código de Comercio."],["Consumidor","Compras en línea. Ley Federal de Protección al Consumidor."],["Penal","Delitos informáticos. Código Penal Federal, arts. 211 bis 1-7."],["Propiedad intelectual","Obras y marcas digitales. LFDA y LFPPI."],["Datos personales","Tratamiento por empresas. LFPDPPP (2025)."]]'></div>`]],
quiz:["¿Qué artículo constitucional reconoce el derecho de acceso a Internet y banda ancha?",["Art. 6.º","Art. 16","Art. 27"],0,"El art. 6.º, reformado en 2013, lo reconoce expresamente."]},
{t:"Derecho a la información y libertad de expresión en el ámbito digital",sh:"Información y expresión",
ana:"Las redes sociales son la plaza del pueblo: puedes hablar, opinar y enterarte de todo, pero no puedes difamar ni gritar “¡fuego!” si no lo hay. Tu libertad termina donde empiezan los derechos de otros.",
tabs:[["Derechos de expresión e información",`<div class="flip" data-flip='[["Derecho a la información (art. 6)","Buscar, recibir y conocer información; incluye acceso a la información pública y derecho de réplica."],["Libertad de expresión (art. 6)","Manifestar ideas sin inquisición judicial o administrativa."],["Libertad de imprenta (art. 7)","Difundir opiniones, información e ideas por cualquier medio, incluido Internet. No hay censura previa."]]'></div>`],
["Límites",`<p>La expresión puede limitarse solo en casos previstos por la ley, por ejemplo cuando:</p><ul><li>Ataque la moral o los derechos de terceros (honor, vida privada).</li><li>Provoque algún delito.</li><li>Perturbe el orden público.</li></ul><p>Y toda restricción debe ser <b>necesaria y proporcional</b>. En Internet pesan mucho la desinformación y la moderación que hacen las plataformas.</p>`],
["Cómo se aborda la desinformación",`<p>Combatir información falsa con leyes punitivas puede terminar persiguiendo opiniones incómodas. Una vía propuesta es la <b>alfabetización mediática</b>: enseñar desde la primaria a verificar fuentes, detectar noticias falsas y compartir con responsabilidad.</p>`]],
quiz:["Un medio publica tu opinión sobre el gobierno. ¿Se puede censurar antes de publicarse?",["Sí, si la autoridad lo decide","No: el art. 7 prohíbe la censura previa","Solo si es en redes sociales"],1,"La censura previa está prohibida; las responsabilidades, en su caso, vienen después."]},
{t:"Derecho a la privacidad: personas públicas, privadas e interés social",sh:"Privacidad",
ana:"Tu vida es una casa. Una persona privada vive con las cortinas cerradas. Una figura pública vive en una casa con ventanas más grandes, pero ni ella está obligada a mostrar su baño.",
tabs:[["Marco legal",`<ul><li><b>Art. 16 constitucional:</b> protege tu vida privada y datos personales; incluye los derechos <b>ARCO</b>: Acceso, Rectificación, Cancelación y Oposición.</li><li><b>Ley Federal de Protección de Datos Personales en Posesión de Particulares</b> (DOF 20/03/2025). Su control pasó del INAI a la Secretaría Anticorrupción y Buen Gobierno.</li><li><b>Art. 1916 del Código Civil Federal:</b> daño moral.</li></ul>`],
["Tipos de persona",`<p>Toca para ver el estándar:</p><div class="flip" data-flip='[["Servidor público","Privacidad mínima en lo relativo a su cargo. Solo responde quien publica con “real malicia” (sabiendo que es falso)."],["Persona pública sin cargo (artistas, influencers)","Privacidad reducida en lo que proyectan. Real malicia en temas de interés público."],["Persona privada","Protección máxima. Basta la negligencia de quien publica para responder."]]'></div>`],
["Interés público y olvido",`<p>Puede difundirse información privada relevante para la sociedad (uso de recursos públicos, conductas delictivas), pero lo íntimo sin relación con la función pública sigue protegido.</p><p>En el <b>AR 341/2022</b> la SCJN resolvió que el “derecho al olvido” europeo no es compatible con la Constitución; sí procede <b>cancelar datos vía ARCO</b>, y el paso del tiempo no elimina por sí solo el interés público.</p><p><b>Retos:</b> imágenes íntimas, recolección masiva de datos y geolocalización.</p>`]],
quiz:["¿Quién tiene mayor protección de su privacidad?",["Un servidor público","Un influencer","Una persona privada"],2,"La persona privada tiene protección máxima; basta negligencia para que responda quien publica."]},
{t:"Prácticas mercantiles a través de Internet",sh:"Comercio electrónico",
ana:"Comprar en línea es como ir al tianguis, pero con el puesto escondido: no ves al vendedor ni tocas el producto. Por eso la ley te da un “recibo” de derechos: información clara, datos protegidos y vías de reclamo.",
tabs:[["Datos",`<div class="stats"><div class="stat"><b>$941 mil mdp</b><small>ventas 2025 (+19.2%)</small></div><div class="stat"><b>17.7%</b><small>de las ventas minoristas</small></div><div class="stat"><b>77.2 M</b><small>compradores</small></div><div class="stat"><b>8.º</b><small>lugar mundial</small></div></div><p>Modalidades: <b>B2C</b> (empresa a consumidor), <b>B2B</b> (entre empresas), <b>C2C</b> (entre consumidores, como en redes sociales) y <b>B2G</b> (compras públicas digitales).</p>`],
["Normas clave",`<div class="tbl"><table><tr><th>Norma</th><th>Qué regula</th></tr><tr><td>Código de Comercio, arts. 89-114</td><td>Mensajes de datos y firma electrónica</td></tr><tr><td>LFPC, art. 76 Bis</td><td>Derechos en compras electrónicas</td></tr><tr><td>NOM-151-SCFI-2016</td><td>Conservación de mensajes de datos</td></tr><tr><td>Ley Fintech (2018)</td><td>Pagos electrónicos y activos virtuales</td></tr><tr><td>Leyes del IVA e ISR (2020)</td><td>Impuestos a plataformas digitales</td></tr></table></div>`],
["Tus derechos",`<p>Según el <b>art. 76 Bis</b>, el proveedor debe:</p><ul><li>Proteger la confidencialidad de tus datos y usar medidas de seguridad.</li><li>Informar su domicilio y medios para reclamaciones.</li><li>Evitar prácticas engañosas y aclarar costos y condiciones.</li></ul><p><b>Profeco</b> ofrece Concilianet, Monitoreo de Tiendas Virtuales y el Distintivo Digital. Abusos comunes: publicidad engañosa y cargos no autorizados.</p>`]],
quiz:["Compraste algo y te cobraron un cargo que no autorizaste. ¿A qué práctica corresponde?",["Práctica indebida del proveedor","Algo normal en línea","Un delito de piratería"],0,"Los cargos no autorizados y la publicidad engañosa son prácticas indebidas; puedes acudir a Profeco."]},
{t:"Propiedad intelectual en Internet",sh:"Propiedad intelectual",
ana:"Una canción, un logo o un meme es como tu casa: tiene dueño. Copiarlo sin permiso es entrar sin pedir llave. Y un logo es como tu nombre: si alguien más lo usa, te confunden con él.",
tabs:[["Dos grandes ramas",`<div class="flip" data-flip='[["Derecho de autor (LFDA)","Protege obras: textos, música, fotos, videos, software. Nace desde que creas la obra, sin necesidad de trámite."],["Propiedad industrial (LFPPI)","Protege marcas, logotipos, patentes y nombres comerciales. Se obtiene registrándolos ante el IMPI."]]'></div><p>Además, los <b>nombres de dominio</b> pueden chocar con marcas ajenas.</p>`],
["Qué pasa en Internet",`<ul><li><b>Copiar y compartir</b> es muy fácil, pero que algo esté en línea no significa que sea libre de usar.</li><li><b>Piratería:</b> sancionada penalmente (CPF, arts. 424 Bis a 427 Quater, reforma de 2020).</li><li><b>Licencias</b> como Creative Commons permiten al autor decidir qué usos autoriza.</li><li>Cita siempre la fuente y respeta los permisos.</li></ul>`]],
quiz:["Encuentras una foto en Google y la usas en tu negocio sin permiso. ¿Es válido?",["Sí, si está en Internet es libre","No, puede tener derechos de autor","Sí, si pones tu logo"],1,"Estar en línea no la hace libre; necesitas permiso o una licencia que lo permita."]},
{t:"Prácticas delictivas a través de Internet",sh:"Delitos informáticos",
ana:"Acceso ilícito a un sistema = alguien que fuerza la cerradura de tu casa. Fraude en línea = el estafador que te llama por teléfono: no entra, pero te convence de abrirle la puerta.",
tabs:[["Datos",`<div class="stats"><div class="stat"><b>18.9 M</b><small>personas sufrieron ciberacoso en 2024 (21%)</small></div><div class="stat"><b>22.2%</b><small>mujeres</small></div><div class="stat"><b>19.6%</b><small>hombres</small></div></div><p><small>INEGI, MOCIBA 2024.</small></p><p><b>Delitos cibernéticos estrictos:</b> afectan sistemas y datos (acceso no autorizado, malware, ransomware). <b>Delitos convencionales por medios digitales:</b> fraude, extorsión, acoso.</p>`],
["Conductas y fundamento",`<div class="tbl"><table><tr><th>Conducta</th><th>Fundamento</th></tr><tr><td>Acceso ilícito a sistemas</td><td>CPF, arts. 211 bis 1-7 (más pena si es del Estado o financiero)</td></tr><tr><td>Difusión de contenido íntimo sin consentimiento (Ley Olimpia)</td><td>CPF, art. 199 Octies: 3 a 6 años de prisión</td></tr><tr><td>Fraude (phishing, tiendas falsas)</td><td>CPF, art. 386</td></tr><tr><td>Extorsión digital</td><td>CPF, art. 390</td></tr><tr><td>Pornografía infantil</td><td>CPF, arts. 201-202 (delito grave)</td></tr><tr><td>Piratería</td><td>CPF, arts. 424 Bis-427 Quater</td></tr><tr><td>Suplantación de identidad y ciberacoso</td><td>Leyes estatales (regulación dispersa)</td></tr></table></div>`],
["Autoridades y retos",`<p><b>Participan:</b> Policía Cibernética (la del Estado de México recibe unos 15 mil reportes al año), FGR, fiscalías locales y Condusef.</p><p><b>Retos:</b> jurisdicción, debilidad de las pruebas digitales, normas distintas entre estados, falta de adhesión al Convenio de Budapest y delitos que no se denuncian.</p>`]],

tabs:[["Validez",`<p>Un contrato digital vale igual que uno físico:</p><ul><li><b>Código Civil Federal:</b> acepta el consentimiento por medios digitales (art. 1803), no exige acuerdo previo para usarlos (art. 1811) y cumple la forma escrita si la información es atribuible a las partes y accesible (art. 1834 bis).</li><li>También: Código de Comercio, Ley de Firma Electrónica Avanzada (2012), LFPC (contratos de adhesión, arts. 85-90; las cláusulas abusivas son nulas) y NOM-151.</li></ul><p><b>Elementos:</b> consentimiento, objeto, capacidad (difícil de verificar en línea) y forma.</p>`],
["Formas de aceptación",`<div class="flip" data-flip='[["Clickwrap","El usuario marca “Acepto”. Fuerza jurídica: alta."],["Browsewrap","Aplica con solo navegar. Fuerza jurídica: débil."],["Shrinkwrap","Se acepta al instalar el software. Fuerza jurídica: media."],["Firma electrónica avanzada","e.firma del SAT. Equivale a firma autógrafa."]]'></div>`],

const L=[{k:'c'}];S.forEach((s,i)=>{L.push({k:'t',i});s.tabs.forEach((_,j)=>L.push({k:'b',i,j}));L.push({k:'q',i})});
let n=0;const st=$('#st'),bd=$('#bd');
function fit(){const k=Math.min(innerWidth/1280,innerHeight/720);st.style.transform='translate(-50%,-50%) scale('+k+')'}
addEventListener('resize',fit);fit();
const first=i=>L.findIndex(x=>x.i===i);
$('#hd').innerHTML='<b>'+im('logoEncabezado',IMG.logoEncabezado)+'Regulación jurídica de Internet</b><button data-g="0" title="Inicio">'+im('inicio',IMG.inicio)+'</button>'+R.map((r,i)=>'<button data-g="'+first(i)+'" data-t="'+i+'" title="'+S[i].sh+'">'+r+'</button>').join('')+'<button id="fs" title="Pantalla completa">'+im('pantallaCompleta',IMG.pantallaCompleta)+'</button>';
$('#hd').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='fs'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();return}go(+b.dataset.g)};
function flips(r){r.querySelectorAll('[data-flip]').forEach(d=>{const a=JSON.parse(d.dataset.flip);d.innerHTML=a.map(x=>'<button><b>'+x[0]+'</b><em>Toca para ver</em></button>').join('');d.querySelectorAll('button').forEach((b,k)=>b.onclick=()=>{const o=b.dataset.o==='1';b.dataset.o=o?'0':'1';b.querySelector('em').textContent=o?'Toca para ver':a[k][1]})})}
function go(x){n=Math.max(0,Math.min(L.length-1,x));const l=L[n],s=S[l.i];let h='';
if(l.k==='c')h='<div class="cv cp"><span class="chip">MATERIA: DERECHO</span><h1>Regulación jurídica de Internet</h1><p>7 temas, ejemplos de la vida diaria y mini quiz. Elige un tema o avanza con las flechas.</p><div class="ic">'+im('logoEncabezado',IMG.logoEncabezado)+'</div></div><div class="grid">'+S.map((s,i)=>'<button class="tile" data-g="'+first(i)+'"><span>'+im('t'+i,IMG.temas[i])+'</span><b>'+R[i]+'. '+s.sh+'</b></button>').join('')+'</div><div class="team"><div class="uni">'+im('universidad',IMG.universidad)+'</div><div class="mem"><b>Integrantes</b><div>'+INTEGRANTES.map(x=>'<span>'+x+'</span>').join('')+'</div></div></div>';
else if(l.k==='t')h='<div class="cv"><span class="chip">TEMA '+R[l.i]+'</span><h1 style="font-size:42px">'+s.t+'</h1><div class="ic">'+im('t'+l.i,IMG.temas[l.i])+'</div></div><div class="ana"><b>'+im('analogia',IMG.analogia)+'Analogía cotidiana</b>'+s.ana+'</div>';
else if(l.k==='b')h='<span class="chip">'+R[l.i]+' · '+s.sh+'</span><h2 style="margin-top:8px">'+s.tabs[l.j][0]+'</h2><div id="pn">'+s.tabs[l.j][1]+'</div>';
else h='<span class="chip">'+R[l.i]+' · MINI QUIZ'+im('quiz',IMG.quiz)+'</span><div class="q" style="margin-top:14px">'+s.quiz[0]+'</div>'+s.quiz[1].map((o,k)=>'<button class="o" data-k="'+k+'">'+o+'</button>').join('')+'<div class="fb" id="fb"></div>';
bd.style.animation='none';bd.offsetWidth;bd.style.animation='';bd.innerHTML=h;bd.scrollTop=0;flips(bd);
bd.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(+b.dataset.g));
if(l.k==='q')bd.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===s.quiz[2];b.classList.add(ok?'ok':'no');$('#fb').innerHTML=ok?im('correcto',IMG.correcto)+'<b>¡Correcto!</b> '+s.quiz[3]:im('incorrecto',IMG.incorrecto)+'Intenta otra vez.'});
document.querySelectorAll('#hd [data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===l.i));
$('#pg').style.width=(n/(L.length-1)*100)+'%';$('#ct').textContent=(n+1)+' / '+L.length;$('#pv').disabled=n===0;$('#nx').disabled=n===L.length-1}
$('#pv').onclick=()=>go(n-1);$('#nx').onclick=()=>go(n+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(n+1);if(e.key==='ArrowLeft')go(n-1);if(e.key==='f')$('#fs').click()});
go(0);
</script></body></html>
